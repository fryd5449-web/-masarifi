<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4eadb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="فلافي" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>العمليات — فلافي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header class="operations-topbar"><div><a href="./index.html" class="back-link" aria-label="العودة للرئيسية">‹</a><h1>العمليات</h1></div></header>
<main class="page operations-page">
<div class="stack">
<section class="operations-totals" aria-label="الإجماليات"><div class="panel total-card"><span>إجمالي المبيعات</span><strong id="salesValue" class="money sales-number"></strong></div><div class="panel total-card"><span>إجمالي المشتريات</span><strong id="purchasesValue" class="money purchases-number"></strong></div></section>
<section class="panel list-card" aria-labelledby="salesHeading"><header class="list-card-heading"><img src="./assets/figma/sales-section.svg" alt="" width="24" height="24" /><h2 id="salesHeading">المبيعات</h2><span class="count-pill"><span id="salesCount"></span> عمليات</span></header><div id="salesList" class="operations-list"></div></section>
<section class="panel list-card" aria-labelledby="purchasesHeading"><header class="list-card-heading"><img src="./assets/figma/purchase-section.svg" alt="" width="24" height="24" /><h2 id="purchasesHeading">المشتريات</h2><span class="count-pill purchase-count"><span id="purchasesCount"></span> عمليات</span></header><div id="purchasesList" class="operations-list"></div></section>
<section id="reportCard" class="panel statement-card"><header class="statement-heading"><img src="./assets/figma/statement.svg" alt="" width="24" height="24" /><div><h2>كشف العمليات</h2><p>حدد الفترة ثم اطبع أو احفظ الكشف PDF</p></div></header>
<form id="reportForm" class="form-grid" novalidate>
<div class="date-range"><div><label class="field-label" for="fromDate">من تاريخ</label><input id="fromDate" class="date-input" type="date" required /></div><div><label class="field-label" for="toDate">إلى تاريخ</label><input id="toDate" class="date-input" type="date" required /></div></div>
<p id="reportError" class="error" role="alert"></p><div class="report-actions"><button class="primary-btn" type="submit">إنشاء الكشف</button><button class="print-btn" id="printReport" type="button">طباعة / حفظ PDF</button></div>
</form></section>
</div></main>
  <div id="modalBackdrop" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-heading"><h2 id="modalTitle">إضافة عملية</h2><button id="closeModal" class="close-btn" type="button" aria-label="إغلاق">×</button></div><form id="transactionForm" class="form-grid"><input id="transactionId" type="hidden" /><input id="transactionType" type="hidden" /><div><label class="field-label" for="transactionAmount">المبلغ <span aria-hidden="true">*</span></label><input id="transactionAmount" class="money-input" inputmode="decimal" autocomplete="off" placeholder="0" required /></div><div><label id="titleLabel" class="field-label" for="transactionTitle">اسم المشتريات (اختياري)</label><input id="transactionTitle" class="text-input" maxlength="80" placeholder="مثال: دقيق وسكر" /></div><div><label class="field-label" for="transactionNote">ملاحظة (اختياري)</label><textarea id="transactionNote" maxlength="240" placeholder="أضف ملاحظة قصيرة"></textarea></div><div><label class="field-label" for="transactionDate">التاريخ</label><input id="transactionDate" class="date-input" type="date" required /></div><p id="formError" class="error" role="alert"></p><div class="form-actions"><button class="outline-btn" id="cancelModal" type="button">إلغاء</button><button class="primary-btn" type="submit">حفظ العملية</button></div></form></section></div>
<script type="module" src="./app.js"></script>
<nav class="bottom-nav" aria-label="التنقل الرئيسي"><a class="nav-item" href="./index.html"><img src="./assets/figma/home.svg" alt="" width="22" height="22" /><span>الرئيسية</span></a><a class="nav-item active" href="./operations.html" aria-current="page"><img src="./assets/figma/operations.svg" alt="" width="22" height="22" /><span>العمليات</span></a><a class="nav-item" href="#reportCard"><img src="./assets/figma/reports.svg" alt="" width="22" height="22" /><span>التقارير</span></a></nav>
</body></html>
