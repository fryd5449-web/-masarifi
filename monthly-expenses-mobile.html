<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e8" />
  <title>حساب المصاريف الشهرية</title>
  <style>
    :root{
      --bg:#f6f1e8;
      --surface:#fffdf8;
      --surface-2:#efe6d8;
      --ink:#25221f;
      --muted:#746d65;
      --accent:#b5523b;
      --accent-dark:#8e3d2c;
      --line:#ded2c3;
      --good:#3f6655;
      --danger:#9b3d34;
      --shadow:0 14px 34px rgba(57,45,35,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(181,82,59,.08), transparent 34%),
        var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic","Tahoma",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    button{touch-action:manipulation}
    .page{
      width:min(100%,560px);
      margin:0 auto;
      padding:
        max(20px, env(safe-area-inset-top))
        16px
        max(28px, env(safe-area-inset-bottom));
    }
    .header{
      padding:8px 4px 18px;
    }
    .header h1{
      margin:0 0 6px;
      font-size:25px;
      line-height:1.35;
      font-weight:800;
      letter-spacing:-.35px;
    }
    .header p{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }
    .card{
      background:rgba(255,253,248,.92);
      border:1px solid rgba(222,210,195,.82);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .salary-card{
      padding:18px;
      margin-bottom:14px;
    }
    .label{
      display:block;
      margin-bottom:8px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .money-field{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:58px;
      padding:0 15px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:17px;
      transition:.18s ease;
    }
    .money-field:focus-within{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(181,82,59,.10);
    }
    .money-field input{
      width:100%;
      min-width:0;
      border:0;
      outline:0;
      background:transparent;
      color:var(--ink);
      font-size:25px;
      font-weight:800;
      direction:ltr;
      text-align:right;
    }
    .currency{
      color:var(--muted);
      font-size:14px;
      font-weight:800;
      white-space:nowrap;
    }
    .summary{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }
    .summary-box{
      min-height:84px;
      padding:13px;
      border-radius:17px;
      background:var(--surface-2);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .summary-box span{
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .summary-box strong{
      font-size:19px;
      line-height:1.2;
      direction:ltr;
      text-align:right;
    }
    .summary-box.remaining strong{color:var(--good)}
    .summary-box.remaining.negative strong{color:var(--danger)}
    .expenses-card{
      overflow:hidden;
    }
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:18px 18px 12px;
    }
    .section-head h2{
      margin:0;
      font-size:18px;
    }
    .section-head small{
      color:var(--muted);
      font-size:12px;
    }
    .rows{
      padding:0 10px 8px;
    }
    .expense-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 112px 38px;
      gap:8px;
      align-items:center;
      padding:9px 8px;
      border-top:1px solid rgba(222,210,195,.72);
    }
    .expense-row:first-child{border-top:0}
    .expense-name,
    .expense-amount{
      width:100%;
      min-width:0;
      height:45px;
      border:1px solid transparent;
      border-radius:13px;
      outline:0;
      background:transparent;
      color:var(--ink);
      transition:.18s ease;
    }
    .expense-name{
      padding:0 10px;
      font-weight:700;
      text-align:right;
    }
    .expense-amount{
      padding:0 10px;
      text-align:left;
      direction:ltr;
      font-weight:800;
      background:#faf6ef;
      border-color:#eee3d5;
    }
    .expense-name:focus,
    .expense-amount:focus{
      background:#fff;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(181,82,59,.09);
    }
    .delete-btn{
      width:38px;
      height:38px;
      border:0;
      border-radius:12px;
      background:transparent;
      color:#9b776d;
      font-size:21px;
      cursor:pointer;
    }
    .delete-btn:active{background:#f6e6e1}
    .actions{
      padding:12px 18px 18px;
      border-top:1px solid var(--line);
    }
    .add-btn{
      width:100%;
      min-height:50px;
      border:0;
      border-radius:15px;
      background:var(--accent);
      color:#fffaf5;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(181,82,59,.18);
    }
    .add-btn:active{
      transform:translateY(1px);
      background:var(--accent-dark);
    }
    .privacy-note{
      margin:13px 5px 0;
      text-align:center;
      color:var(--muted);
      font-size:11px;
      line-height:1.65;
    }
    @media (max-width:380px){
      .expense-row{grid-template-columns:minmax(0,1fr) 94px 36px}
      .expense-row{gap:5px}
      .page{padding-left:11px;padding-right:11px}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>مصاريفي الشهرية</h1>
      <p>عدّل الراتب والبنود مباشرة، والحساب يتحدث تلقائيًا.</p>
    </header>

    <section class="card salary-card" aria-label="ملخص الشهر">
      <label class="label" for="salary">الراتب الإجمالي</label>
      <div class="money-field">
        <input id="salary" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="الراتب الإجمالي" />
        <span class="currency">ر.س</span>
      </div>

      <div class="summary">
        <div class="summary-box">
          <span>مجموع المصاريف</span>
          <strong id="totalExpenses">0 ر.س</strong>
        </div>
        <div class="summary-box remaining" id="remainingBox">
          <span>المتبقي</span>
          <strong id="remaining">0 ر.س</strong>
        </div>
      </div>
    </section>

    <section class="card expenses-card" aria-label="بنود المصاريف">
      <div class="section-head">
        <h2>المصاريف</h2>
        <small>الاسم والمبلغ قابلان للتعديل</small>
      </div>

      <div class="rows" id="rows"></div>

      <div class="actions">
        <button class="add-btn" id="addExpense" type="button">+ إضافة بند جديد</button>
      </div>
    </section>

    <p class="privacy-note">البيانات تُحفظ على هذا الجهاز داخل المتصفح فقط.</p>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "monthly-expenses-v1";
    const defaultData = {
      salary: "",
      expenses: [
        { name: "الإيجار", amount: "" },
        { name: "المشتريات", amount: "" },
        { name: "القرض", amount: "" },
        { name: "الكهرباء", amount: "" },
        { name: "فاتورة الجوال", amount: "" }
      ]
    };

    const salaryInput = document.getElementById("salary");
    const rowsEl = document.getElementById("rows");
    const addBtn = document.getElementById("addExpense");
    const totalExpensesEl = document.getElementById("totalExpenses");
    const remainingEl = document.getElementById("remaining");
    const remainingBox = document.getElementById("remainingBox");

    let state = loadState();

    function normalizeDigits(value) {
      const arabic = "٠١٢٣٤٥٦٧٨٩";
      const eastern = "۰۱۲۳۴۵۶۷۸۹";
      return String(value ?? "")
        .replace(/[٠-٩]/g, d => arabic.indexOf(d))
        .replace(/[۰-۹]/g, d => eastern.indexOf(d))
        .replace(/[٬,\s]/g, "")
        .replace(/٫/g, ".");
    }

    function toNumber(value) {
      const cleaned = normalizeDigits(value).replace(/[^\d.]/g, "");
      const firstDot = cleaned.indexOf(".");
      const safe = firstDot === -1
        ? cleaned
        : cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, "");
      const n = Number(safe);
      return Number.isFinite(n) ? n : 0;
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("ar-SA", {
        maximumFractionDigits: 2
      }).format(value) + " ر.س";
    }

    function sanitizeState(data) {
      if (!data || typeof data !== "object") return structuredClone(defaultData);
      const expenses = Array.isArray(data.expenses)
        ? data.expenses.slice(0, 100).map(item => ({
            name: typeof item?.name === "string" ? item.name.slice(0, 60) : "",
            amount: typeof item?.amount === "string" ? item.amount.slice(0, 30) : ""
          }))
        : structuredClone(defaultData.expenses);

      return {
        salary: typeof data.salary === "string" ? data.salary.slice(0, 30) : "",
        expenses: expenses.length ? expenses : structuredClone(defaultData.expenses)
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? sanitizeState(JSON.parse(raw)) : structuredClone(defaultData);
      } catch {
        return structuredClone(defaultData);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // الصفحة تبقى شغالة حتى لو منع المتصفح التخزين.
      }
    }

    function makeInput(className, value, label, inputMode) {
      const input = document.createElement("input");
      input.className = className;
      input.value = value;
      input.setAttribute("aria-label", label);
      input.autocomplete = "off";
      if (inputMode) input.inputMode = inputMode;
      return input;
    }

    function renderRows() {
      rowsEl.replaceChildren();

      state.expenses.forEach((expense, index) => {
        const row = document.createElement("div");
        row.className = "expense-row";

        const nameInput = makeInput("expense-name", expense.name, "اسم بند المصروف");
        nameInput.maxLength = 60;
        nameInput.placeholder = "اسم المصروف";
        nameInput.addEventListener("input", () => {
          state.expenses[index].name = nameInput.value.slice(0, 60);
          saveState();
        });

        const amountInput = makeInput("expense-amount", expense.amount, "مبلغ المصروف", "decimal");
        amountInput.maxLength = 30;
        amountInput.placeholder = "0";
        amountInput.addEventListener("input", () => {
          state.expenses[index].amount = amountInput.value.slice(0, 30);
          saveState();
          updateSummary();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete-btn";
        deleteBtn.setAttribute("aria-label", "حذف البند");
        deleteBtn.textContent = "×";
        deleteBtn.addEventListener("click", () => {
          state.expenses.splice(index, 1);
          saveState();
          renderRows();
          updateSummary();
        });

        row.append(nameInput, amountInput, deleteBtn);
        rowsEl.appendChild(row);
      });
    }

    function updateSummary() {
      const salary = toNumber(state.salary);
      const total = state.expenses.reduce((sum, item) => sum + toNumber(item.amount), 0);
      const remaining = salary - total;

      totalExpensesEl.textContent = formatMoney(total);
      remainingEl.textContent = formatMoney(remaining);
      remainingBox.classList.toggle("negative", remaining < 0);
    }

    salaryInput.value = state.salary;
    salaryInput.addEventListener("input", () => {
      state.salary = salaryInput.value.slice(0, 30);
      saveState();
      updateSummary();
    });

    addBtn.addEventListener("click", () => {
      if (state.expenses.length >= 100) return;
      state.expenses.push({ name: "بند جديد", amount: "" });
      saveState();
      renderRows();
      updateSummary();

      const names = rowsEl.querySelectorAll(".expense-name");
      const latest = names[names.length - 1];
      latest?.focus();
      latest?.select();
    });

    renderRows();
    updateSummary();
  </script>
</body>
</html>
